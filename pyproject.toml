[project]
name = "mlsentimentservice"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "scikit-learn==1.5.2",
    "fastapi==0.115.0",
    "uvicorn[standard]==0.32.0",
    "pydantic-settings==2.6.0",
    "joblib==1.4.2",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.3",
    "pytest-cov==6.0.0",
    "httpx==0.27.2",
    "ruff==0.7.0",
]

[project.scripts]
sentiment-train = "sentiment.train:main"
sentiment-api = "sentiment.api:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"